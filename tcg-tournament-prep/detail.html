<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prep – FaB Tournament Prep</title>
  <script src="../nav.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,700&family=DM+Serif+Text:ital@0;1&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #1c1814; --surface: #252018; --surface2: #2e271d;
      --border: #3a3025; --border2: #4a3e2e; --accent: #c4864a;
      --accent-bg: rgba(196,134,74,0.08); --accent-border: rgba(196,134,74,0.25); --accent-dim: rgba(196,134,74,0.10);
      --text: #e8dfd0; --muted: #9a8a76; --muted2: #b5a48e; --muted-2: #5a4e40;
      --t1: #c4864a; --t1-bg: rgba(196,134,74,0.08); --t1-border: rgba(196,134,74,0.22);
      --t2: #d4924a; --t2-bg: rgba(212,146,74,0.08); --t2-border: rgba(212,146,74,0.22);
      --t3: #5ab4cc; --t3-bg: rgba(90,180,204,0.08); --t3-border: rgba(90,180,204,0.22);
      --t4: #a07ae8; --t4-bg: rgba(160,122,232,0.08); --t4-border: rgba(160,122,232,0.22);
      --red-c: #e05040; --yellow-c: #d4924a; --blue-c: #5ab4cc;
    }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text); font-family: 'DM Serif Text', Georgia, serif; -webkit-font-smoothing: antialiased; line-height: 1.6; }
    body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; background-image: radial-gradient(circle, rgba(255,255,255,0.025) 1px, transparent 1px), radial-gradient(circle, rgba(255,255,255,0.015) 1px, transparent 1px); background-size: 4px 4px, 6px 6px; background-position: 0 0, 2px 2px; }
    #page-content, footer { position: relative; z-index: 1; }
    .page-header { padding: 2rem 1.5rem 1.5rem; border-bottom: 2px solid var(--text); position: relative; z-index: 1; }
    .page-header-inner { max-width: 1000px; margin: 0 auto; }
    .prep-meta { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.75rem; }
    .tier-badge { font-family: 'DM Serif Text', Georgia, serif; font-size: 0.65rem; font-style: italic; letter-spacing: 0.06em; text-transform: uppercase; padding: 0.18rem 0.55rem; border-radius: 2px; border: 1px solid; }
    .tier-badge.t1 { color: var(--t1); background: var(--t1-bg); border-color: var(--t1-border); }
    .tier-badge.t2 { color: var(--t2); background: var(--t2-bg); border-color: var(--t2-border); }
    .tier-badge.t3 { color: var(--t3); background: var(--t3-bg); border-color: var(--t3-border); }
    .tier-badge.t4 { color: var(--t4); background: var(--t4-bg); border-color: var(--t4-border); }
    .format-chip { font-family: 'DM Serif Text', Georgia, serif; font-size: 0.65rem; font-style: italic; letter-spacing: 0.06em; text-transform: uppercase; padding: 0.18rem 0.55rem; border-radius: 2px; background: var(--t3-bg); border: 1px solid var(--t3-border); color: var(--t3); }
    .prep-title { font-family: 'Cormorant Garamond', Georgia, serif; font-size: clamp(1.8rem, 4vw, 3.5rem); font-weight: 900; font-style: italic; letter-spacing: -0.02em; line-height: 1; margin-bottom: 0.5rem; }
    .prep-date { font-family: 'DM Serif Text', Georgia, serif; font-size: 0.82rem; font-style: italic; color: var(--muted2); }
    .header-links { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.85rem; }
    .header-link-btn { display: inline-flex; align-items: center; gap: 0.35rem; font-family: 'DM Serif Text', Georgia, serif; font-size: 0.75rem; font-style: italic; padding: 0.3rem 0.8rem; border-radius: 2px; border: 1px solid var(--border2); color: var(--muted2); background: transparent; text-decoration: none; transition: border-color 0.15s, color 0.15s; }
    .header-link-btn:hover { border-color: var(--muted2); color: var(--text); }
    .main { max-width: 1000px; width: 100%; margin: 2rem auto; padding: 0 1.5rem 4rem; display: flex; flex-direction: column; gap: 1.25rem; }
    .format-card { background: var(--surface); border: 1px solid var(--border); border-radius: 2px; overflow: hidden; border-left: 2px solid var(--accent); }
    .format-card-header { padding: 0.9rem 1.4rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 0.75rem; background: var(--surface2); }
    .format-name { font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-size: 1rem; font-weight: 700; letter-spacing: -0.01em; }
    .format-abbr-badge { font-family: 'DM Serif Text', Georgia, serif; font-style: italic; font-size: 0.65rem; letter-spacing: 0.07em; text-transform: uppercase; padding: 0.15rem 0.5rem; border-radius: 999px; background: var(--accent-bg); border: 1px solid var(--accent-border); color: var(--accent); }
    .prep-section { padding: 1rem 1.4rem; border-bottom: 1px solid var(--border); }
    .prep-section:last-child { border-bottom: none; }
    .section-label { font-family: 'DM Serif Text', Georgia, serif; font-style: italic; font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.5rem; }
    .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border2); }
    .hero-pick-row { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.65rem; }
    .hero-name { font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-size: 1.1rem; font-weight: 700; color: var(--text); }
    .hero-reasons { list-style: none; display: flex; flex-direction: column; gap: 0.3rem; }
    .hero-reasons li { font-family: 'DM Serif Text', Georgia, serif; font-size: 0.85rem; color: var(--muted2); line-height: 1.6; padding-left: 1.2rem; position: relative; }
    .hero-reasons li::before { content: '–'; position: absolute; left: 0; color: var(--muted); }
    .meta-table { width: 100%; border-collapse: collapse; font-family: 'DM Serif Text', Georgia, serif; }
    .meta-table th { font-size: 0.65rem; font-weight: 400; font-style: italic; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); text-align: left; padding: 0.35rem 0.65rem; border-bottom: 1px solid var(--border2); background: var(--surface2); }
    .meta-table td { font-size: 0.85rem; color: var(--muted2); padding: 0.45rem 0.65rem; border-bottom: 1px solid var(--border); line-height: 1.45; }
    .meta-table tr:last-child td { border-bottom: none; }
    .meta-table td:nth-child(2) { font-weight: 700; color: var(--accent); white-space: nowrap; }
    .meta-table td:nth-child(1) { font-weight: 600; color: var(--text); }
    .date-entry { border: 1px solid var(--border); border-radius: 2px; overflow: hidden; margin-bottom: 0.5rem; }
    .date-entry:last-child { margin-bottom: 0; }
    .date-btn { width: 100%; display: flex; align-items: center; gap: 0.6rem; background: var(--surface2); border: none; color: var(--text); font-family: 'DM Serif Text', Georgia, serif; font-size: 0.85rem; cursor: pointer; text-align: left; padding: 0.6rem 0.9rem; transition: background 0.15s; }
    .date-btn:hover { background: rgba(196,134,74,0.05); }
    .date-label { font-family: 'DM Serif Text', Georgia, serif; font-style: italic; font-size: 0.72rem; letter-spacing: 0.07em; text-transform: uppercase; color: var(--accent); }
    .date-chevron { margin-left: auto; font-size: 1rem; color: var(--muted); transition: transform 0.25s; display: inline-block; }
    .date-btn[aria-expanded="true"] .date-chevron { transform: rotate(90deg); }
    .date-content { display: none; padding: 0.85rem 0.9rem; border-top: 1px solid var(--border); }
    .date-content.open { display: block; }
    .note-section { margin-bottom: 0.75rem; }
    .note-section:last-child { margin-bottom: 0; }
    .note-section-heading { font-family: 'DM Serif Text', Georgia, serif; font-style: italic; font-size: 0.7rem; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.4rem; }
    .note-bullets { list-style: none; display: flex; flex-direction: column; gap: 0.3rem; }
    .note-bullets li { font-family: 'DM Serif Text', Georgia, serif; font-size: 0.85rem; color: var(--muted2); line-height: 1.6; padding-left: 1.2rem; position: relative; }
    .note-bullets li::before { content: '–'; position: absolute; left: 0; color: var(--muted); }
    .note-paragraphs { display: flex; flex-direction: column; gap: 0.5rem; }
    .note-para { font-family: 'DM Serif Text', Georgia, serif; font-size: 0.85rem; color: var(--muted2); line-height: 1.65; }
    .not-found { text-align: center; padding: 5rem 1rem; color: var(--muted); font-family: 'DM Serif Text', Georgia, serif; }
    .not-found h2 { font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-size: 1.4rem; margin-bottom: 0.75rem; color: var(--text); }
    .format-tabs { display: flex; gap: 0.35rem; padding: 0 0 1rem; border-bottom: 1px solid var(--border); margin-bottom: 1.25rem; }
    .tab-btn { font-family: 'DM Serif Text', Georgia, serif; font-style: italic; background: var(--surface); border: 1px solid var(--border2); color: var(--muted2); font-size: 0.8rem; padding: 0.4rem 1rem; border-radius: 2px; cursor: pointer; transition: all 0.18s; }
    .tab-btn:hover { border-color: var(--muted2); color: var(--text); }
    .tab-btn.active { background: var(--accent-bg); border-color: var(--accent-border); color: var(--accent); }
    .summary-card { background: rgba(196,134,74,0.04); border: 1px solid var(--accent-border); border-radius: 2px; padding: 1rem 1.25rem; margin-bottom: 0.15rem; }
    .summary-label { font-family: 'DM Serif Text', Georgia, serif; font-style: italic; font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.5rem; }
    .summary-label::after { content: ''; flex: 1; height: 1px; background: var(--accent-border); }
    .summary-list { list-style: none; display: flex; flex-direction: column; gap: 0.4rem; }
    .summary-list li { font-family: 'DM Serif Text', Georgia, serif; font-size: 0.85rem; color: var(--muted2); line-height: 1.6; padding-left: 1.2rem; position: relative; }
    .summary-list li::before { content: '–'; position: absolute; left: 0; color: var(--accent); }
    .tldraw-section { margin-bottom: 0; }
    .tldraw-header { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; padding: 0.75rem 1rem; background: var(--surface2); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    .tldraw-header-actions { display: flex; align-items: center; gap: 0.5rem; }
    .tldraw-label { font-family: 'DM Serif Text', Georgia, serif; font-style: italic; font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
    .tldraw-open-link { display: inline-flex; align-items: center; gap: 0.35rem; font-family: 'DM Serif Text', Georgia, serif; font-size: 0.75rem; font-style: italic; padding: 0.25rem 0.7rem; border-radius: 2px; border: 1px solid var(--border2); color: var(--muted2); background: transparent; text-decoration: none; cursor: pointer; transition: border-color 0.15s, color 0.15s; }
    .tldraw-open-link:hover { border-color: var(--muted2); color: var(--text); }
    .tldraw-iframe-wrapper { position: relative; overflow: hidden; height: 72vh; min-height: 480px; border-bottom: 1px solid var(--border); background: var(--surface); }
    .tldraw-iframe { position: absolute; top: -52px; left: 0; width: 100%; height: calc(100% + 116px); border: none; display: block; }

    /* ── Borrow tracker ── */
    .borrow-tracker { background: var(--surface); border: 1px solid var(--border); border-radius: 2px; border-left: 2px solid var(--accent); margin-bottom: 1.25rem; }
    .borrow-tracker-header { padding: 0.9rem 1.4rem; border-bottom: 1px solid var(--border); background: var(--surface2); }
    .borrow-tracker-title { font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-size: 1.1rem; font-weight: 700; }
    .borrow-tracker-sub { font-family: 'DM Serif Text', Georgia, serif; font-size: 0.78rem; color: var(--muted); margin-top: 0.25rem; }
    .borrow-cols { display: grid; grid-template-columns: 1fr 1fr; }
    .borrow-col { padding: 1rem 1.4rem; }
    .borrow-col + .borrow-col { border-left: 1px solid var(--border); }
    .borrow-col-header { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; margin-bottom: 0.75rem; }
    .borrow-col-title { font-family: 'DM Serif Text', Georgia, serif; font-style: italic; font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
    .borrow-add-btn { font-family: 'DM Serif Text', Georgia, serif; font-size: 0.72rem; font-style: italic; padding: 0.28rem 0.7rem; border-radius: 2px; border: 1px solid var(--accent-border); background: var(--accent-bg); color: var(--accent); cursor: pointer; transition: background 0.15s, border-color 0.15s; }
    .borrow-add-btn:hover { background: rgba(196,134,74,0.16); border-color: var(--accent); }
    .borrow-groups { display: flex; flex-direction: column; gap: 0.65rem; }
    .borrow-empty { font-family: 'DM Serif Text', Georgia, serif; font-size: 0.8rem; font-style: italic; color: var(--muted); padding: 0.5rem 0; }
    .borrow-group { border: 1px solid var(--border); border-radius: 2px; overflow: hidden; }
    .borrow-group-header { display: flex; align-items: center; gap: 0.5rem; padding: 0.45rem 0.7rem; background: var(--surface2); border-bottom: 1px solid var(--border); }
    .borrow-group-person { font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-weight: 700; font-size: 0.95rem; color: var(--text); }
    .borrow-group-count { font-family: 'DM Serif Text', Georgia, serif; font-size: 0.7rem; color: var(--muted); margin-left: auto; }
    .borrow-group-remove { background: none; border: none; color: var(--muted); font-size: 1rem; line-height: 1; cursor: pointer; padding: 0.1rem 0.3rem; transition: color 0.15s; }
    .borrow-group-remove:hover { color: var(--red-c); }
    .borrow-card-rows { display: flex; flex-direction: column; }
    .borrow-card-row { display: flex; align-items: center; gap: 0.6rem; padding: 0.4rem 0.7rem; border-bottom: 1px solid var(--border); }
    .borrow-card-row:last-child { border-bottom: none; }
    .borrow-card-row.returned { opacity: 0.5; }
    .borrow-card-check { flex-shrink: 0; width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; }
    .borrow-card-img { width: 30px; height: 42px; object-fit: cover; object-position: top center; border-radius: 2px; background: var(--border); flex-shrink: 0; display: block; }
    .borrow-card-img-placeholder { width: 30px; height: 42px; flex-shrink: 0; background: var(--border); border-radius: 2px; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 0.6rem; }
    .borrow-card-info { min-width: 0; flex: 1; }
    .borrow-card-name { font-family: 'DM Serif Text', Georgia, serif; font-size: 0.82rem; color: var(--text); display: flex; align-items: center; gap: 0.4rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .borrow-card-row.returned .borrow-card-name { text-decoration: line-through; }
    .borrow-returned-tag { font-family: 'DM Serif Text', Georgia, serif; font-style: italic; font-size: 0.62rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); flex-shrink: 0; }
    .borrow-pitch-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .borrow-pitch-dot.red { background: var(--red-c); } .borrow-pitch-dot.yellow { background: var(--yellow-c); } .borrow-pitch-dot.blue { background: var(--blue-c); }
    .borrow-card-qty { font-family: 'DM Serif Text', Georgia, serif; font-size: 0.78rem; color: var(--muted2); flex-shrink: 0; }
    .borrow-card-remove { background: none; border: none; color: var(--muted); font-size: 0.95rem; line-height: 1; cursor: pointer; padding: 0.1rem 0.3rem; flex-shrink: 0; transition: color 0.15s; }
    .borrow-card-remove:hover { color: var(--red-c); }

    /* ── Borrow tracker: add-card modal ── */
    .borrow-modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .borrow-modal { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--border2); border-radius: 3px; box-shadow: 0 12px 40px rgba(0,0,0,0.5); }
    .borrow-modal-header { display: flex; align-items: center; justify-content: space-between; padding: 0.85rem 1.1rem; border-bottom: 1px solid var(--border); background: var(--surface2); }
    .borrow-modal-title { font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-weight: 700; font-size: 1.05rem; }
    .borrow-modal-close { background: none; border: none; color: var(--muted); font-size: 1.2rem; line-height: 1; cursor: pointer; padding: 0.1rem 0.3rem; }
    .borrow-modal-close:hover { color: var(--text); }
    .borrow-modal-body { padding: 1rem 1.1rem; display: flex; flex-direction: column; gap: 0.85rem; }
    .borrow-field label { display: block; font-family: 'DM Serif Text', Georgia, serif; font-style: italic; font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.35rem; }
    .borrow-field input[type="text"], .borrow-field input[type="number"] { width: 100%; background: var(--surface2); border: 1px solid var(--border2); border-radius: 2px; color: var(--text); font-family: 'DM Serif Text', Georgia, serif; font-size: 0.88rem; padding: 0.5rem 0.65rem; }
    .borrow-field input:focus { outline: none; border-color: var(--accent); }
    .borrow-modal-err { font-family: 'DM Serif Text', Georgia, serif; font-size: 0.78rem; color: var(--red-c); display: none; }
    .borrow-modal-hint { font-family: 'DM Serif Text', Georgia, serif; font-size: 0.72rem; font-style: italic; color: var(--muted); margin-top: 0.3rem; }
    .borrow-modal-actions { display: flex; gap: 0.5rem; padding: 0 1.1rem 1.1rem; }
    .borrow-btn-primary, .borrow-btn-secondary { flex: 1; font-family: 'DM Serif Text', Georgia, serif; font-style: italic; font-size: 0.8rem; padding: 0.55rem 1rem; border-radius: 2px; cursor: pointer; text-align: center; }
    .borrow-btn-primary { background: var(--accent); border: 1px solid rgba(196,134,74,0.5); color: #1c1814; font-weight: 700; }
    .borrow-btn-primary:hover { background: #d59860; }
    .borrow-btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .borrow-btn-secondary { background: transparent; border: 1px solid var(--border2); color: var(--muted2); }
    .borrow-btn-secondary:hover { border-color: var(--muted2); color: var(--text); }

    .card-ac-wrap { position: relative; }
    .card-ac-list { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--surface2); border: 1px solid var(--border2); border-radius: 3px; max-height: 240px; overflow-y: auto; z-index: 1100; box-shadow: 0 8px 28px rgba(0,0,0,0.6); }
    .card-ac-item { display: flex; align-items: center; gap: 0.6rem; padding: 0.4rem 0.6rem; cursor: pointer; font-family: 'DM Serif Text', Georgia, serif; font-size: 0.85rem; color: var(--text); border-bottom: 1px solid var(--border); }
    .card-ac-item:last-child { border-bottom: none; }
    .card-ac-item:hover, .card-ac-item[aria-selected="true"] { background: var(--accent-dim); color: var(--accent); }
    .card-ac-img { width: 32px; height: 45px; object-fit: cover; object-position: top center; border-radius: 2px; background: var(--border); flex-shrink: 0; display: block; }
    .card-ac-img-placeholder { width: 32px; height: 45px; flex-shrink: 0; background: var(--border); border-radius: 2px; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 0.6rem; }
    .card-ac-info { display: flex; flex-direction: column; gap: 0.15rem; min-width: 0; }
    .card-ac-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 0.35rem; }
    .card-ac-meta { font-size: 0.7rem; color: var(--muted2); }

    @media (max-width: 600px) { .prep-title { font-size: 1.4rem; } .prep-section { padding: 0.85rem 1rem; } .page-header { padding: 1.75rem 1.25rem 1.5rem; } .format-card-header { padding: 0.85rem 1rem; } .date-content { padding: 0.7rem 0.85rem; } .borrow-cols { grid-template-columns: 1fr; } .borrow-col + .borrow-col { border-left: none; border-top: 1px solid var(--border); } }
    footer { padding: 1.5rem 2rem; font-family: 'DM Serif Text', Georgia, serif; font-size: 0.72rem; color: var(--muted-2); border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; position: relative; z-index: 1; }
    footer a { color: var(--muted); text-decoration: none; }
    footer a:hover { color: var(--accent); }
  </style>
</head>
<body>

  <div id="page-content"></div>

  <div id="borrow-modal-backdrop" class="borrow-modal-backdrop" style="display:none" role="dialog" aria-modal="true" aria-label="Add borrowed card">
    <div class="borrow-modal">
      <div class="borrow-modal-header">
        <span class="borrow-modal-title" id="borrow-modal-title">Add Card</span>
        <button class="borrow-modal-close" id="borrow-modal-close" aria-label="Close">&times;</button>
      </div>
      <div class="borrow-modal-body">
        <div class="borrow-field">
          <label for="borrow-person-input" id="borrow-person-label">Name</label>
          <input type="text" id="borrow-person-input" list="borrow-person-datalist" placeholder="Person's name" autocomplete="off" maxlength="60" />
          <datalist id="borrow-person-datalist"></datalist>
        </div>
        <div class="borrow-field">
          <label>Card</label>
          <div class="card-ac-wrap">
            <input type="text" id="borrow-card-input" placeholder="Search by name…" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="borrow-card-ac-list" />
            <div id="borrow-card-ac-list" class="card-ac-list" role="listbox" style="display:none;"></div>
          </div>
          <div class="borrow-modal-hint" id="borrow-card-loading" style="display:none">Loading card database…</div>
        </div>
        <div class="borrow-field">
          <label for="borrow-qty-input">Quantity</label>
          <input type="number" id="borrow-qty-input" min="1" max="99" value="1" />
        </div>
        <div class="borrow-modal-err" id="borrow-modal-err"></div>
      </div>
      <div class="borrow-modal-actions">
        <button class="borrow-btn-primary" id="borrow-modal-save">Add Card</button>
        <button class="borrow-btn-secondary" id="borrow-modal-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <footer>
    <span id="page-version" style="opacity:0.65"></span>
    <a href="https://github.com/xssxghjk/My-FaB-Journey" target="_blank" rel="noopener">View on GitHub</a>
    <span id="storage-size"></span>
  </footer>
  <script>fetch('../version.json').then(r=>r.json()).then(v=>{var e=document.getElementById('page-version');if(e)e.textContent='v'+v.version}).catch(()=>{});</script>
<script>(function(){var u=0;try{for(var k in localStorage){if(Object.prototype.hasOwnProperty.call(localStorage,k))u+=(k.length+localStorage[k].length)*2}}catch(e){}var pct=+(u/(5*1024*1024)*100).toFixed(1),el=document.getElementById('storage-size');if(el){el.textContent='Storage: '+pct+'%';el.style.opacity=0.65;if(pct>90)el.style.color='#f87171';else if(pct>70)el.style.color='#fbbf24';}})();</script>

  <script src="preps.js"></script>
  <script>
  (function () {
    const TIER_INFO = {
      RTN: { tier: 1, label: 'Tier 1 · RTN' }, PQ: { tier: 1, label: 'Tier 1 · PQ' },
      Battleground: { tier: 2, label: 'Tier 2 · Battleground' }, Showdown: { tier: 2, label: 'Tier 2 · Showdown' },
      Calling: { tier: 3, label: 'Tier 3 · Calling' }, Worlds: { tier: 4, label: 'Tier 4 · Worlds' }, PT: { tier: 4, label: 'Tier 4 · Pro Tour' },
    };
    function getTierLabel(eventType) { return (TIER_INFO[eventType] || { label: 'Tier ? · ' + eventType }).label; }
    function esc(str) { return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    function renderDateEntry(dateGroup, index) {
      const sectionsHtml = dateGroup.sections.map(sec => {
        if (sec.heading) {
          return `<div class="note-section"><div class="note-section-heading">${esc(sec.heading)}</div><ul class="note-bullets">${sec.entries.map(e => `<li>${esc(e)}</li>`).join('')}</ul></div>`;
        } else {
          return `<div class="note-section"><div class="note-paragraphs">${sec.entries.map(e => `<p class="note-para">${esc(e)}</p>`).join('')}</div></div>`;
        }
      }).join('');
      const entryId = `date-content-${index}`;
      return `<div class="date-entry"><button class="date-btn" aria-expanded="true" data-target="${entryId}"><span class="date-label">${esc(dateGroup.date)}</span><span class="date-chevron">›</span></button><div class="date-content open" id="${entryId}">${sectionsHtml}</div></div>`;
    }

    function renderFormat(fmt, fmtIndex) {
      const heroReasonsHtml = fmt.heroReasons.map(r => `<li>${esc(r)}</li>`).join('');
      const summaryHtml = fmt.summary && fmt.summary.length ? `<div class="summary-card"><div class="summary-label">Summary</div><ul class="summary-list">${fmt.summary.map(s => `<li>${esc(s)}</li>`).join('')}</ul></div>` : '';
      const metaHtml = fmt.predictedMeta.length ? `<div class="prep-section"><div class="section-label">Predicted Meta</div><table class="meta-table"><thead><tr><th>Hero / Archetype</th><th>Share</th><th>Note</th></tr></thead><tbody>${fmt.predictedMeta.map(m => `<tr><td>${esc(m.matchup)}</td><td>${esc(m.share)}</td><td>${esc(m.note)}</td></tr>`).join('')}</tbody></table></div>` : '';
      const notesHtml = fmt.notes.length ? `<div class="prep-section"><div class="section-label">Prep Notes</div>${fmt.notes.map((d, i) => renderDateEntry(d, fmtIndex * 100 + i)).join('')}</div>` : '';
      return `
        <div class="format-card" data-format-id="${esc(fmt.id)}">
          <div class="format-card-header"><span class="format-abbr-badge">${esc(fmt.abbr)}</span><span class="format-name">${esc(fmt.name)}</span></div>
          ${summaryHtml ? `<div class="prep-section">${summaryHtml}</div>` : ''}
          <div class="prep-section"><div class="section-label">Hero Pick</div><div class="hero-pick-row"><span class="hero-name">${esc(fmt.hero)}</span></div><ul class="hero-reasons">${heroReasonsHtml}</ul></div>
          ${metaHtml}${notesHtml}
        </div>`;
    }

    /* ── Borrow tracker ──────────────────────────────────────────────── */
    const BORROW_DB_URL = 'https://raw.githubusercontent.com/the-fab-cube/flesh-and-blood-cards/main/json/english/card.json';
    const BORROW_STORAGE_KEY = 'fab_borrow_tracker_v1';
    const PITCH_LABEL = { red: 'Red · 1', yellow: 'Yellow · 2', blue: 'Blue · 3' };
    let borrowDb = null;
    let borrowDbLoading = null;
    let borrowCurrentDirection = null;
    let borrowSelectedEntry = null;

    function loadBorrowStore() {
      try { return JSON.parse(localStorage.getItem(BORROW_STORAGE_KEY)) || {}; }
      catch { return {}; }
    }
    function saveBorrowStore(store) {
      localStorage.setItem(BORROW_STORAGE_KEY, JSON.stringify(store));
    }
    function getBorrowEventData(store, prepId) {
      if (!store[prepId]) store[prepId] = { borrowing: [], lending: [] };
      if (!store[prepId].borrowing) store[prepId].borrowing = [];
      if (!store[prepId].lending) store[prepId].lending = [];
      return store[prepId];
    }
    function makeId() {
      return (crypto && crypto.randomUUID) ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2);
    }

    async function ensureBorrowDb() {
      if (borrowDb) return borrowDb;
      if (borrowDbLoading) return borrowDbLoading;
      borrowDbLoading = (async () => {
        const resp = await fetch(BORROW_DB_URL);
        if (!resp.ok) throw new Error(`HTTP ${resp.status} fetching card database`);
        const cards = await resp.json();
        const map = new Map();
        for (const card of cards) {
          const printing = card.printings && card.printings.length ? card.printings[0] : null;
          const imgUrl = printing ? (printing.image_url || null) : null;
          const pitchNum = card.pitch !== '' ? parseInt(card.pitch, 10) : null;
          const entry = {
            name: card.name,
            pitch: isNaN(pitchNum) ? null : pitchNum,
            color: (card.color || '').toLowerCase(),
            types: Array.isArray(card.types) ? card.types : [],
            imgUrl,
          };
          const nameLow = card.name.toLowerCase();
          if (entry.color) map.set(`${nameLow}_${entry.color}`, entry);
          if (!map.has(nameLow)) map.set(nameLow, entry);
        }
        borrowDb = map;
        return borrowDb;
      })();
      return borrowDbLoading;
    }

    function getAllBorrowCardVariants() {
      if (!borrowDb) return [];
      const seen = new Set();
      const variants = [];
      for (const entry of borrowDb.values()) {
        const key = entry.name.toLowerCase() + '|' + (entry.color || '');
        if (!seen.has(key)) { seen.add(key); variants.push(entry); }
      }
      return variants;
    }

    function renderBorrowTrackerSection(prepId) {
      return `
        <section class="borrow-tracker" id="borrow-tracker" data-prep-id="${esc(prepId)}">
          <div class="borrow-tracker-header">
            <div class="borrow-tracker-title">Borrow Tracker</div>
            <div class="borrow-tracker-sub">Track cards you're borrowing from others, and cards you're lending out, for this event.</div>
          </div>
          <div class="borrow-cols">
            <div class="borrow-col" data-direction="borrowing">
              <div class="borrow-col-header"><span class="borrow-col-title">Borrowing</span><button class="borrow-add-btn" data-direction="borrowing">+ Add Card</button></div>
              <div class="borrow-groups" id="borrow-groups-borrowing">${renderBorrowGroupsHtml(prepId, 'borrowing')}</div>
            </div>
            <div class="borrow-col" data-direction="lending">
              <div class="borrow-col-header"><span class="borrow-col-title">Lending</span><button class="borrow-add-btn" data-direction="lending">+ Add Card</button></div>
              <div class="borrow-groups" id="borrow-groups-lending">${renderBorrowGroupsHtml(prepId, 'lending')}</div>
            </div>
          </div>
        </section>`;
    }

    function renderBorrowCardRow(card, direction, groupId) {
      const dot = card.color && PITCH_LABEL[card.color] ? `<span class="borrow-pitch-dot ${card.color}" title="${esc(PITCH_LABEL[card.color])}"></span>` : '';
      const imgEl = card.imgUrl
        ? `<img class="borrow-card-img" src="${esc(card.imgUrl)}" alt="" loading="lazy" />`
        : `<div class="borrow-card-img-placeholder">?</div>`;
      const returnedClass = card.returned ? ' returned' : '';
      const returnedTag = card.returned ? `<span class="borrow-returned-tag">Returned</span>` : '';
      const returnedLabel = direction === 'borrowing' ? 'returned to lender' : 'returned by borrower';
      return `
        <div class="borrow-card-row${returnedClass}">
          <input type="checkbox" class="borrow-card-check" data-action="toggle-returned" data-direction="${direction}" data-group="${esc(groupId)}" data-card="${esc(card.id)}" title="Mark as returned" aria-label="Mark ${esc(card.name)} as ${returnedLabel}"${card.returned ? ' checked' : ''} />
          ${imgEl}
          <div class="borrow-card-info"><span class="borrow-card-name">${dot}${esc(card.name)}</span></div>
          ${returnedTag}
          <span class="borrow-card-qty">×${card.qty}</span>
          <button class="borrow-card-remove" data-action="remove-card" data-direction="${direction}" data-group="${esc(groupId)}" data-card="${esc(card.id)}" title="Remove card" aria-label="Remove ${esc(card.name)}">&times;</button>
        </div>`;
    }

    function renderBorrowGroupsHtml(prepId, direction) {
      const store = loadBorrowStore();
      const data = getBorrowEventData(store, prepId);
      const groups = [...data[direction]].sort((a, b) => a.person.localeCompare(b.person));
      if (!groups.length) {
        return `<div class="borrow-empty">No cards ${direction === 'borrowing' ? 'borrowed' : 'lent out'} yet.</div>`;
      }
      return groups.map(group => {
        const totalQty = group.cards.reduce((s, c) => s + c.qty, 0);
        const returnedQty = group.cards.filter(c => c.returned).reduce((s, c) => s + c.qty, 0);
        const countText = `${totalQty} card${totalQty === 1 ? '' : 's'}${returnedQty ? ` · ${returnedQty} returned` : ''}`;
        const sortedCards = [...group.cards].sort((a, b) => (a.returned ? 1 : 0) - (b.returned ? 1 : 0));
        const rowsHtml = sortedCards.map(c => renderBorrowCardRow(c, direction, group.id)).join('');
        return `
          <div class="borrow-group" data-group-id="${esc(group.id)}">
            <div class="borrow-group-header">
              <span class="borrow-group-person">${esc(group.person)}</span>
              <span class="borrow-group-count">${countText}</span>
              <button class="borrow-group-remove" data-action="remove-group" data-direction="${direction}" data-group="${esc(group.id)}" title="Remove ${esc(group.person)}" aria-label="Remove ${esc(group.person)}">&times;</button>
            </div>
            <div class="borrow-card-rows">${rowsHtml}</div>
          </div>`;
      }).join('');
    }

    function refreshBorrowColumn(prepId, direction) {
      const el = document.getElementById(`borrow-groups-${direction}`);
      if (el) el.innerHTML = renderBorrowGroupsHtml(prepId, direction);
    }

    function addBorrowCard(prepId, direction, person, entry, qty) {
      const store = loadBorrowStore();
      const data = getBorrowEventData(store, prepId);
      const personTrimmed = person.trim();
      let group = data[direction].find(g => g.person.toLowerCase() === personTrimmed.toLowerCase());
      if (!group) {
        group = { id: makeId(), person: personTrimmed, cards: [] };
        data[direction].push(group);
      }
      const existing = group.cards.find(c => c.name.toLowerCase() === entry.name.toLowerCase() && (c.color || '') === (entry.color || ''));
      if (existing) {
        existing.qty += qty;
      } else {
        group.cards.push({ id: makeId(), name: entry.name, color: entry.color || '', imgUrl: entry.imgUrl || null, qty, returned: false });
      }
      saveBorrowStore(store);
    }

    function toggleBorrowCardReturned(prepId, direction, groupId, cardId) {
      const store = loadBorrowStore();
      const data = getBorrowEventData(store, prepId);
      const group = data[direction].find(g => g.id === groupId);
      if (!group) return;
      const card = group.cards.find(c => c.id === cardId);
      if (!card) return;
      card.returned = !card.returned;
      saveBorrowStore(store);
    }

    function removeBorrowCard(prepId, direction, groupId, cardId) {
      const store = loadBorrowStore();
      const data = getBorrowEventData(store, prepId);
      const group = data[direction].find(g => g.id === groupId);
      if (!group) return;
      group.cards = group.cards.filter(c => c.id !== cardId);
      if (!group.cards.length) {
        data[direction] = data[direction].filter(g => g.id !== groupId);
      }
      saveBorrowStore(store);
    }

    function removeBorrowGroup(prepId, direction, groupId) {
      const store = loadBorrowStore();
      const data = getBorrowEventData(store, prepId);
      data[direction] = data[direction].filter(g => g.id !== groupId);
      saveBorrowStore(store);
    }

    function closeBorrowCardAc() {
      const list = document.getElementById('borrow-card-ac-list');
      const input = document.getElementById('borrow-card-input');
      if (list) { list.style.display = 'none'; list.innerHTML = ''; }
      if (input) input.setAttribute('aria-expanded', 'false');
    }

    function buildBorrowCardAc(query) {
      const list = document.getElementById('borrow-card-ac-list');
      const input = document.getElementById('borrow-card-input');
      const q = query.toLowerCase().trim();
      if (q.length < 2) { closeBorrowCardAc(); return; }
      const allVariants = getAllBorrowCardVariants();
      const starts = allVariants.filter(e => e.name.toLowerCase().startsWith(q));
      const contains = allVariants.filter(e => !e.name.toLowerCase().startsWith(q) && e.name.toLowerCase().includes(q));
      const results = [...starts, ...contains].slice(0, 18);
      if (!results.length) { closeBorrowCardAc(); return; }
      list.innerHTML = '';
      results.forEach(entry => {
        const item = document.createElement('div');
        item.className = 'card-ac-item';
        item.setAttribute('role', 'option');
        const pitchLabel = PITCH_LABEL[entry.color] || '';
        const typesStr = Array.isArray(entry.types) ? entry.types.slice(0, 2).join(', ') : '';
        const meta = [typesStr, pitchLabel].filter(Boolean).join(' · ');
        const dot = entry.color && PITCH_LABEL[entry.color] ? `<span class="borrow-pitch-dot ${entry.color}"></span>` : '';
        const imgEl = entry.imgUrl
          ? `<img class="card-ac-img" src="${esc(entry.imgUrl)}" alt="" loading="lazy" />`
          : `<div class="card-ac-img-placeholder">?</div>`;
        item.innerHTML = imgEl + `<div class="card-ac-info"><div class="card-ac-name">${dot}${esc(entry.name)}</div>${meta ? `<div class="card-ac-meta">${esc(meta)}</div>` : ''}</div>`;
        item.addEventListener('mousedown', e => {
          e.preventDefault();
          input.value = entry.name;
          borrowSelectedEntry = entry;
          closeBorrowCardAc();
        });
        list.appendChild(item);
      });
      list.style.display = '';
      input.setAttribute('aria-expanded', 'true');
    }

    function openBorrowModal(prepId, direction) {
      borrowCurrentDirection = direction;
      borrowSelectedEntry = null;
      document.getElementById('borrow-modal-title').textContent = direction === 'borrowing' ? 'Add Borrowed Card' : 'Add Card to Lend';
      document.getElementById('borrow-person-label').textContent = direction === 'borrowing' ? 'Borrowing from' : 'Lending to';
      document.getElementById('borrow-person-input').value = '';
      document.getElementById('borrow-card-input').value = '';
      document.getElementById('borrow-qty-input').value = '1';
      document.getElementById('borrow-modal-err').style.display = 'none';
      document.getElementById('borrow-modal-err').textContent = '';
      closeBorrowCardAc();

      const store = loadBorrowStore();
      const data = getBorrowEventData(store, prepId);
      const names = [...new Set(data[direction].map(g => g.person))];
      document.getElementById('borrow-person-datalist').innerHTML = names.map(n => `<option value="${esc(n)}"></option>`).join('');

      const backdrop = document.getElementById('borrow-modal-backdrop');
      backdrop.style.display = 'flex';
      backdrop.dataset.prepId = prepId;
      document.body.style.overflow = 'hidden';
      setTimeout(() => document.getElementById('borrow-person-input').focus(), 60);

      const loadingEl = document.getElementById('borrow-card-loading');
      const saveBtn = document.getElementById('borrow-modal-save');
      if (!borrowDb) {
        loadingEl.style.display = '';
        saveBtn.disabled = true;
        ensureBorrowDb().then(() => {
          loadingEl.style.display = 'none';
          saveBtn.disabled = false;
        }).catch(err => {
          loadingEl.style.display = 'none';
          saveBtn.disabled = false;
          const errEl = document.getElementById('borrow-modal-err');
          errEl.textContent = 'Could not load card database: ' + err.message;
          errEl.style.display = '';
        });
      }
    }

    function closeBorrowModal() {
      document.getElementById('borrow-modal-backdrop').style.display = 'none';
      document.body.style.overflow = '';
      closeBorrowCardAc();
      borrowCurrentDirection = null;
      borrowSelectedEntry = null;
    }

    function initBorrowTracker(prepId) {
      const section = document.getElementById('borrow-tracker');
      if (!section) return;

      section.querySelectorAll('.borrow-add-btn').forEach(btn => {
        btn.addEventListener('click', () => openBorrowModal(prepId, btn.dataset.direction));
      });

      section.addEventListener('click', e => {
        const removeCardBtn = e.target.closest('[data-action="remove-card"]');
        const removeGroupBtn = e.target.closest('[data-action="remove-group"]');
        const toggleReturnedBtn = e.target.closest('[data-action="toggle-returned"]');
        if (removeCardBtn) {
          const { direction, group, card } = removeCardBtn.dataset;
          removeBorrowCard(prepId, direction, group, card);
          refreshBorrowColumn(prepId, direction);
        } else if (removeGroupBtn) {
          const { direction, group } = removeGroupBtn.dataset;
          const groupData = loadBorrowStore()[prepId]?.[direction]?.find(g => g.id === group);
          if (groupData && !confirm(`Remove all cards for "${groupData.person}"?`)) return;
          removeBorrowGroup(prepId, direction, group);
          refreshBorrowColumn(prepId, direction);
        } else if (toggleReturnedBtn) {
          const { direction, group, card } = toggleReturnedBtn.dataset;
          toggleBorrowCardReturned(prepId, direction, group, card);
          refreshBorrowColumn(prepId, direction);
        }
      });

      const cardInput = document.getElementById('borrow-card-input');
      cardInput.addEventListener('input', () => { borrowSelectedEntry = null; buildBorrowCardAc(cardInput.value); });
      cardInput.addEventListener('blur', () => setTimeout(closeBorrowCardAc, 120));
      cardInput.addEventListener('keydown', e => { if (e.key === 'Escape') closeBorrowCardAc(); });

      document.getElementById('borrow-modal-close').addEventListener('click', closeBorrowModal);
      document.getElementById('borrow-modal-cancel').addEventListener('click', closeBorrowModal);
      document.getElementById('borrow-modal-backdrop').addEventListener('click', function (e) {
        if (e.target === this) closeBorrowModal();
      });

      document.getElementById('borrow-modal-save').addEventListener('click', () => {
        const errEl = document.getElementById('borrow-modal-err');
        errEl.style.display = 'none';
        const person = document.getElementById('borrow-person-input').value.trim();
        const qty = parseInt(document.getElementById('borrow-qty-input').value, 10);

        if (!person) {
          errEl.textContent = 'Name is required.';
          errEl.style.display = '';
          return;
        }
        if (!borrowSelectedEntry) {
          errEl.textContent = 'Select a card from the list.';
          errEl.style.display = '';
          return;
        }
        if (!qty || qty < 1) {
          errEl.textContent = 'Quantity must be at least 1.';
          errEl.style.display = '';
          return;
        }

        addBorrowCard(prepId, borrowCurrentDirection, person, borrowSelectedEntry, qty);
        refreshBorrowColumn(prepId, borrowCurrentDirection);
        closeBorrowModal();
      });
    }

    function renderDetail(p) {
      const tierLabel = getTierLabel(p.eventType);
      const tierClass = `t${p.tier}`;
      const formatChipsHtml = p.formats.map(f => `<span class="format-chip">${esc(f.abbr)} · ${esc(f.hero)}</span>`).join('');
      const headerLinks = [];
      if (p.reportId) headerLinks.push(`<a class="header-link-btn" href="../tcg-tournament-reports/detail.html?id=${encodeURIComponent(p.reportId)}"><svg width="11" height="11" viewBox="0 0 12 12" fill="none"><rect x="2" y="1" width="8" height="10" rx="1.5" stroke="currentColor" stroke-width="1.5"/><path d="M4 4h4M4 6.5h4M4 9h2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>Tournament Report</a>`);
      if (p.omnSetStats) headerLinks.push(`<a class="header-link-btn" href="./omn-set-stats.html"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1.5l1 2.5h2.5l-2 1.5.75 2.5L7 6.5 4.75 8l.75-2.5-2-1.5H6L7 1.5z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M2.5 10.5h9M4.5 12.5h5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>OMN Set Stats</a>`);
      const reportLinkHtml = headerLinks.length ? `<div class="header-links">${headerLinks.join('')}</div>` : '';
      const tldrawHtml = p.tldrawUrl ? `<div class="tldraw-section"><div class="tldraw-header"><span class="tldraw-label">Prep Graph</span><div class="tldraw-header-actions"><a class="tldraw-open-link" href="${esc(p.tldrawUrl)}" target="_blank" rel="noopener">Open in tldraw ↗</a></div></div><div class="tldraw-iframe-wrapper" id="tldraw-wrapper"><iframe class="tldraw-iframe" src="${esc(p.tldrawUrl)}" frameborder="0" allowfullscreen title="Prep graph"></iframe></div></div>` : '';
      const hasFormatContent = p.formats.some(f => f.summary.length || f.heroReasons.length || f.predictedMeta.length || f.notes.length);
      const tabsHtml = p.formats.length > 1 ? `<div class="format-tabs">${p.formats.map((f, i) => `<button class="tab-btn${i === 0 ? ' active' : ''}" data-tab="${esc(f.id)}">${esc(f.name)}</button>`).join('')}</div>` : '';
      const formatsHtml = hasFormatContent ? p.formats.map((f, i) => `<div class="format-tab-panel" data-panel="${esc(f.id)}"${i !== 0 ? ' style="display:none"' : ''}>${renderFormat(f, i)}</div>`).join('') : '';
      return `
        <header class="page-header"><div class="page-header-inner">
          <div class="prep-meta"><span class="tier-badge ${tierClass}">${esc(tierLabel)}</span>${formatChipsHtml}</div>
          <h1 class="prep-title">${esc(p.event)}</h1>
          <div class="prep-date">${esc(p.displayDate)}</div>
          ${reportLinkHtml}
        </div></header>
        ${tldrawHtml}
        <main class="main">${renderBorrowTrackerSection(p.id)}${tabsHtml}${formatsHtml}</main>`;
    }

    function initCollapsibles() {
      document.querySelectorAll('.date-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const expanded = btn.getAttribute('aria-expanded') === 'true';
          btn.setAttribute('aria-expanded', String(!expanded));
          const target = document.getElementById(btn.dataset.target);
          if (target) target.classList.toggle('open', !expanded);
        });
      });
    }
    function initTabs() {
      const tabBtns = document.querySelectorAll('.tab-btn');
      if (!tabBtns.length) return;
      tabBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          const tabId = btn.dataset.tab;
          tabBtns.forEach(b => b.classList.toggle('active', b.dataset.tab === tabId));
          document.querySelectorAll('.format-tab-panel').forEach(panel => {
            panel.style.display = panel.dataset.panel === tabId ? '' : 'none';
          });
        });
      });
    }

    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const prep = PREPS.find(p => p.id === id);
    const container = document.getElementById('page-content');
    if (!prep) {
      container.innerHTML = `<div class="not-found"><h2>Prep not found</h2><p>The prep entry <strong>${esc(id || '')}</strong> doesn't exist.</p><p style="margin-top:1rem"><a href="./" style="color:var(--accent)">← Back to all preps</a></p></div>`;
    } else {
      document.title = `${prep.event} Prep – FaB Tournament Prep`;
      container.innerHTML = renderDetail(prep);
      initCollapsibles();
      initTabs();
      initBorrowTracker(prep.id);
    }
  })();
  </script>

</body>
</html>
