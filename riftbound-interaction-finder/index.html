<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Riftbound Interaction Finder — My FaB Journey</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,700&family=DM+Serif+Text:ital@0;1&family=Playfair+Display:ital,wght@0,700;0,900;1,400&display=swap">
  <style>
    [hidden] { display: none !important; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #1c1814;
      --surface: #252018;
      --surface2: #2e271d;
      --border: #3a3025;
      --border2: #4a3e2e;
      --accent: #c4864a;
      --accent-bg: rgba(196,134,74,0.08);
      --accent-border: rgba(196,134,74,0.25);
      --text: #e8dfd0;
      --muted: #9a8a76;
      --muted2: #b5a48e;
      --muted-dim: #5a4e40;

      --dom-fury:       #d9463a;
      --dom-calm:       #4f9e6e;
      --dom-mind:       #3f8fd1;
      --dom-body:       #d98a3d;
      --dom-chaos:      #9b5cd6;
      --dom-order:      #cdb03c;
      --dom-colorless:  #8a8378;

      --action-color:   #5ab4cc;
      --reaction-color: #e0685a;
      --hidden-color:   #9a97c9;
    }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Serif Text', Georgia, serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.6;
      min-height: 100vh;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.025) 1px, transparent 1px),
        radial-gradient(circle, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 4px 4px, 6px 6px;
      background-position: 0 0, 2px 2px;
    }

    .page { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; padding: 3rem 1.5rem 6rem; }
    .page-header { margin-bottom: 1.75rem; padding-bottom: 1.25rem; border-bottom: 2px solid var(--text); }
    .page-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(2.2rem, 6vw, 3.6rem);
      font-weight: 900;
      font-style: italic;
      letter-spacing: -0.02em;
      line-height: 1;
      margin-bottom: 0.6rem;
    }
    .page-subtitle { font-size: 0.85rem; color: var(--muted); max-width: 640px; }

    /* ── Mode toggle ── */
    .mode-toggle { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .mode-btn {
      flex: 1; text-align: center; padding: 0.65rem 1rem;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 3px; cursor: pointer; color: var(--muted2);
      font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 700; font-style: italic;
      font-size: 1.05rem; transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .mode-btn:hover { border-color: var(--muted-dim); }
    .mode-btn.active { color: var(--text); border-color: var(--accent); background: var(--accent-bg); }

    /* ── Controls ── */
    .controls {
      border: 1px solid var(--border);
      border-radius: 3px;
      margin-bottom: 2rem;
      background: var(--surface);
      padding: 1rem 1.15rem 1.15rem;
    }
    .control-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem; }
    .control-row + .control-row { margin-top: 0.85rem; }
    .control-label { font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase; font-style: italic; color: var(--muted-dim); width: 100%; }

    .rb-select {
      flex: 1; min-width: 160px;
      background: var(--surface2); border: 1px solid var(--border2);
      color: var(--text); padding: 0.5rem 0.7rem; border-radius: 3px;
      font-family: 'DM Serif Text', Georgia, serif; font-size: 0.85rem;
      appearance: none; cursor: pointer;
    }
    .rb-select:focus { outline: none; border-color: var(--accent); }
    .vs-divider { flex-shrink: 0; color: var(--muted-dim); font-style: italic; font-size: 0.85rem; }

    .reset-btn {
      margin-left: auto; padding: 0.4rem 0.9rem; background: transparent;
      border: 1px solid var(--border2); color: var(--muted); border-radius: 20px;
      cursor: pointer; font-size: 0.72rem; font-style: italic; font-family: inherit;
      transition: color 0.15s, border-color 0.15s;
    }
    .reset-btn:hover { color: var(--text); border-color: var(--muted-dim); }

    .result-count { font-size: 0.72rem; color: var(--muted-dim); font-style: italic; margin-top: 0.7rem; }

    /* ── Loading / empty ── */
    .status-msg { padding: 3rem 1rem; text-align: center; color: var(--muted); font-size: 0.9rem; font-style: italic; }

    /* ── Signature section ── */
    .sig-section { margin-bottom: 1.75rem; }
    .sig-heading {
      display: flex; align-items: center; gap: 0.6rem;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.4rem; font-weight: 700; font-style: italic;
      padding-bottom: 0.5rem; margin-bottom: 0.9rem;
      border-bottom: 1px solid var(--accent-border);
      color: var(--accent);
    }
    .sig-heading .count { margin-left: auto; font-family: 'DM Serif Text', Georgia, serif; font-size: 0.72rem; color: var(--muted-dim); font-style: italic; }
    .sig-note { font-size: 0.72rem; color: var(--muted-dim); font-style: italic; margin: -0.5rem 0 0.9rem; }

    /* ── Cost groups ── */
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 0.65rem; }

    .cost-divider { display: flex; align-items: center; gap: 0.6rem; margin: 0.85rem 0 0.5rem; }
    .cost-divider:first-child { margin-top: 0; }
    .cost-divider::before, .cost-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .cost-divider-badge {
      flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center;
      min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px;
      background: var(--surface2); border: 1px solid var(--border2);
      font-size: 0.72rem; color: var(--accent); font-style: normal;
    }
    .cost-divider-label { flex-shrink: 0; font-size: 0.68rem; color: var(--muted-dim); font-style: italic; }

    .rb-card {
      display: flex; gap: 0.7rem;
      background: var(--surface); border: 1px solid var(--border);
      border-left: 3px solid var(--dom, var(--accent));
      border-radius: 2px; padding: 0.7rem 0.8rem;
    }
    .rb-body { flex: 1; min-width: 0; }
    .rb-top { display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.2rem; }
    .rb-cost {
      flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center;
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--surface2); border: 1px solid var(--border2);
      font-size: 0.75rem; color: var(--accent); font-style: normal;
    }
    .rb-domdots { display: inline-flex; gap: 2px; flex-shrink: 0; }
    .rb-domdot { width: 9px; height: 9px; border-radius: 50%; }
    .rb-name { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 700; font-style: italic; font-size: 1.02rem; }
    .rb-badges { display: flex; gap: 0.3rem; margin-left: auto; flex-shrink: 0; }
    .rb-badge { font-size: 0.6rem; letter-spacing: 0.06em; padding: 0.1rem 0.4rem; border-radius: 2px; font-style: normal; font-family: 'DM Serif Text', Georgia, serif; }
    .rb-badge.action { color: var(--action-color); border: 1px solid color-mix(in srgb, var(--action-color) 45%, transparent); background: color-mix(in srgb, var(--action-color) 12%, transparent); }
    .rb-badge.reaction { color: var(--reaction-color); border: 1px solid color-mix(in srgb, var(--reaction-color) 45%, transparent); background: color-mix(in srgb, var(--reaction-color) 12%, transparent); }
    .rb-badge.hidden { color: var(--hidden-color); border: 1px solid color-mix(in srgb, var(--hidden-color) 45%, transparent); background: color-mix(in srgb, var(--hidden-color) 12%, transparent); }
    .rb-badge.kw { color: var(--muted2); border: 1px solid var(--border2); background: var(--surface2); }
    .rb-meta { font-size: 0.68rem; color: var(--muted-dim); }

    /* ── Legend footer ── */
    .color-legend { display: flex; flex-wrap: wrap; gap: 0.9rem 1.4rem; margin-top: 2.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border); }
    .color-legend-item { display: flex; align-items: center; gap: 0.4rem; font-size: 0.75rem; color: var(--muted2); }
    .color-legend-dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }

    @media (max-width: 600px) {
      .page { padding: 2rem 1.25rem 4rem; }
      .card-grid { grid-template-columns: 1fr; }
      .reset-btn { margin-left: 0; flex-basis: 100%; }
      .vs-divider { flex-basis: 100%; text-align: center; }
    }
  </style>
</head>
<body>
<div class="page">
  <header class="page-header">
    <h1 class="page-title">Riftbound Interaction Finder</h1>
    <p class="page-subtitle">Pick two colors, or a leader, to see every Action / Reaction / Hidden card you could be holding up during a game — grouped by Energy cost so you can scan it fast.</p>
  </header>

  <div class="mode-toggle">
    <button class="mode-btn active" id="modeColors" type="button">By Colors</button>
    <button class="mode-btn" id="modeLeader" type="button">By Leader</button>
  </div>

  <div class="controls">
    <div class="control-row" id="colorControls">
      <span class="control-label">Two colors</span>
      <select class="rb-select" id="colorA">
        <option value="">Color A…</option>
      </select>
      <span class="vs-divider">+</span>
      <select class="rb-select" id="colorB">
        <option value="">Color B…</option>
      </select>
    </div>
    <div class="control-row" id="leaderControls" hidden>
      <span class="control-label">Leader</span>
      <select class="rb-select" id="leaderSelect">
        <option value="">Select a leader…</option>
      </select>
    </div>
    <div class="control-row">
      <button class="reset-btn" id="resetBtn" type="button">Reset</button>
    </div>
    <div class="result-count" id="resultCount"></div>
  </div>

  <div id="results"></div>

  <div class="color-legend" id="colorLegend"></div>
</div>

<script>
(function () {
  'use strict';

  // Curated pool: this tool intentionally does not draw from the full card
  // database. Only these cards (plus each leader's own signature card,
  // pinned when that leader is selected) are ever shown.
  var CARD_POOL = [
    {"name":"Ki Barrier","cost":2,"domain":"order","type":"spell","kw":["Reaction"]},
    {"name":"Smoke Screen","cost":2,"domain":"mind","type":"spell","kw":["Reaction"]},
    {"name":"Wages of Pain","cost":3,"domain":"neutral","type":"spell","kw":["Hidden","Action"]},
    {"name":"Deadly Flourish","cost":4,"domain":"neutral","type":"spell","kw":[]},
    {"name":"Decree of Unity","cost":2,"domain":"order","type":"spell","kw":[]},
    {"name":"Hidden Blade","cost":2,"domain":"neutral","type":"spell","kw":["Hidden","Action"]},
    {"name":"Salvage","cost":2,"domain":"order","type":"spell","kw":["Action"]},
    {"name":"Deathgrip","cost":2,"domain":"order","type":"spell","kw":["Reaction"]},
    {"name":"Retreat","cost":1,"domain":"neutral","type":"spell","kw":["Reaction"]},
    {"name":"Sprite Burst","cost":5,"domain":"neutral","type":"spell","kw":[]},
    {"name":"Turn to Dust","cost":2,"domain":"neutral","type":"spell","kw":[]},
    {"name":"Harnessed Dragon","cost":8,"domain":"order","type":"unit","kw":[]},
    {"name":"Ashe, Focused","cost":5,"domain":"order","type":"unit","kw":[],"leader":"ashe"},
    {"name":"Sacrifice","cost":1,"domain":"neutral","type":"spell","kw":["Reaction"]},
    {"name":"Unchecked Power","cost":7,"domain":"mind","type":"spell","kw":[]},
    {"name":"Eclipse","cost":3,"domain":"neutral","type":"spell","kw":["Reaction"]},
    {"name":"Vi, Peacekeeper","cost":5,"domain":"order","type":"unit","kw":[],"leader":"vi"},
    {"name":"Cull the Weak","cost":2,"domain":"neutral","type":"spell","kw":[]},
    {"name":"Time Warp","cost":10,"domain":"mind","type":"spell","kw":[]},
    {"name":"Sprite Fountain","cost":2,"domain":"mind","type":"gear","kw":[]},
    {"name":"Perfect Execution","cost":3,"domain":"fury","type":"spell","kw":["Flow"]},
    {"name":"Temporal Breach","cost":2,"domain":"mind","type":"spell","kw":["Hidden"]},
    {"name":"Rebuke","cost":2,"domain":"chaos","type":"spell","kw":["Action"]},
    {"name":"Bellows Breath","cost":1,"domain":"mind","type":"spell","kw":["Action","Repeat"]},
    {"name":"Stupefy","cost":1,"domain":"neutral","type":"spell","kw":["Reaction"]},
    {"name":"Hextech Ray","cost":1,"domain":"fury","type":"spell","kw":["Action"]},
    {"name":"Against the Odds","cost":2,"domain":"fury","type":"spell","kw":["Reaction"]},
    {"name":"Long Sword","cost":2,"domain":"fury","type":"gear","kw":["Reaction"]},
    {"name":"Pyke, Dockside Butcher","cost":3,"domain":"fury","type":"unit","kw":["Hidden"],"leader":"pyke"},
    {"name":"Thousand-Tailed Watcher","cost":7,"domain":"neutral","type":"unit","kw":[]},
    {"name":"Inferna","cost":2,"domain":"fury","type":"unit","kw":["Ambush"]},
    {"name":"Falling Star","cost":2,"domain":"fury","type":"spell","kw":[]},
    {"name":"Brittle Steel","cost":2,"domain":"fury","type":"spell","kw":["Flow"]},
    {"name":"Cleave","cost":1,"domain":"fury","type":"spell","kw":["Action"]},
    {"name":"Decree of Rage","cost":1,"domain":"fury","type":"spell","kw":["Action"]},
    {"name":"Blood Rush","cost":1,"domain":"fury","type":"spell","kw":["Action","Repeat"]},
    {"name":"Darius, Trifarian","cost":5,"domain":"fury","type":"unit","kw":[],"leader":"darius"},
    {"name":"Flash","cost":2,"domain":"chaos","type":"spell","kw":["Reaction"]},
    {"name":"Kha'Zix, Mutating Horror","cost":4,"domain":"chaos","type":"unit","kw":["Ambush"],"leader":"khazix"},
    {"name":"Singularity","cost":6,"domain":"neutral","type":"spell","kw":[]},
    {"name":"Gust","cost":1,"domain":"chaos","type":"spell","kw":["Reaction"]},
    {"name":"Hard Bargain","cost":2,"domain":"chaos","type":"spell","kw":["Reaction","Repeat"]},
    {"name":"Abandon","cost":2,"domain":"chaos","type":"spell","kw":["Reaction"]},
    {"name":"Tideturner","cost":2,"domain":"chaos","type":"unit","kw":["Hidden"]},
    {"name":"Switcheroo","cost":2,"domain":"chaos","type":"spell","kw":["Hidden","Action"]},
    {"name":"En Garde","cost":1,"domain":"calm","type":"spell","kw":["Reaction"]},
    {"name":"Charm","cost":1,"domain":"calm","type":"spell","kw":[]},
    {"name":"Defy","cost":1,"domain":"calm","type":"spell","kw":["Reaction"]},
    {"name":"Not So Fast","cost":2,"domain":"calm","type":"spell","kw":["Reaction"]},
    {"name":"Decree of Focus","cost":1,"domain":"calm","type":"spell","kw":["Reaction"]},
    {"name":"First Mate","cost":3,"domain":"body","type":"unit","kw":[]},
    {"name":"Fizz, Trickster","cost":3,"domain":"chaos","type":"unit","kw":[],"leader":"fizz"},
    {"name":"Ride the Wind","cost":2,"domain":"chaos","type":"spell","kw":["Action"]},
    {"name":"Star-Crossed","cost":3,"domain":"chaos","type":"spell","kw":["Reaction"]},
    {"name":"Crumbling Sands","cost":1,"domain":"calm","type":"spell","kw":["Reaction"]},
    {"name":"Back Off","cost":3,"domain":"calm","type":"spell","kw":["Hidden","Action"]},
    {"name":"Zhonya's Hourglass","cost":2,"domain":"calm","type":"gear","kw":["Hidden"]},
    {"name":"Discipline","cost":2,"domain":"calm","type":"spell","kw":["Reaction"]},
    {"name":"Rengar, Trophy Hunter","cost":5,"domain":"body","type":"unit","kw":["Ambush"],"leader":"rengar"},
    {"name":"Rampage","cost":3,"domain":"body","type":"spell","kw":[]},
    {"name":"Punch First","cost":1,"domain":"body","type":"spell","kw":["Action"]}
  ];

  var DOMAIN_ORDER = ['Fury', 'Calm', 'Mind', 'Body', 'Chaos', 'Order', 'Colorless'];
  var COLOR_DOMAINS = ['Fury', 'Calm', 'Mind', 'Body', 'Chaos', 'Order'];
  var DOMAIN_VAR = { Fury: '--dom-fury', Calm: '--dom-calm', Mind: '--dom-mind', Body: '--dom-body', Chaos: '--dom-chaos', Order: '--dom-order', Colorless: '--dom-colorless' };
  var DOMAIN_KEY = { fury: 'Fury', calm: 'Calm', mind: 'Mind', body: 'Body', chaos: 'Chaos', order: 'Order', neutral: 'Colorless' };
  var INTERACTION_KW = ['Action', 'Reaction', 'Hidden'];

  var interactionCards = [];  // pool cards (excluding leader cards) carrying Action/Reaction/Hidden
  var leaders = [];           // { id, champion, label, domains: [...], signatureCards: [...] }

  var mode = 'colors'; // 'colors' | 'leader'
  var state = { colorA: '', colorB: '', leaderId: '' };

  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  function normalizeCard(c) {
    var kw = c.kw || [];
    var domainKey = DOMAIN_KEY[c.domain] || 'Colorless';
    return {
      name: c.name,
      type: c.type,
      domainKey: domainKey,
      requiredDomain: c.domain === 'neutral' ? null : domainKey,
      cost: c.cost,
      hasAction: kw.indexOf('Action') !== -1,
      hasReaction: kw.indexOf('Reaction') !== -1,
      hasHidden: kw.indexOf('Hidden') !== -1,
      otherKw: kw.filter(function (k) { return INTERACTION_KW.indexOf(k) === -1; }),
      leader: c.leader || null
    };
  }

  // A card fits a set of colors if its domain (ignoring neutral/colorless) is among them.
  function cardFitsColors(card, colors) {
    if (!card.requiredDomain) return true;
    return colors.indexOf(card.requiredDomain) !== -1;
  }

  function sortByCostThenName(a, b) {
    var ea = a.cost == null ? -1 : a.cost, eb = b.cost == null ? -1 : b.cost;
    return ea - eb || a.name.localeCompare(b.name);
  }

  function groupByCost(cards) {
    var groups = [];
    cards.slice().sort(sortByCostThenName).forEach(function (c) {
      var last = groups[groups.length - 1];
      if (!last || last.cost !== c.cost) groups.push({ cost: c.cost, cards: [] });
      groups[groups.length - 1].cards.push(c);
    });
    return groups;
  }

  function renderCard(card) {
    var badges = '';
    if (card.hasAction) badges += '<span class="rb-badge action">ACTION</span>';
    if (card.hasReaction) badges += '<span class="rb-badge reaction">REACTION</span>';
    if (card.hasHidden) badges += '<span class="rb-badge hidden">HIDDEN</span>';
    card.otherKw.forEach(function (k) { badges += '<span class="rb-badge kw">' + escapeHtml(k.toUpperCase()) + '</span>'; });
    var dot = '<span class="rb-domdot" style="background:var(' + DOMAIN_VAR[card.domainKey] + ')" title="' + card.domainKey + '"></span>';
    return (
      '<div class="rb-card" style="--dom:var(' + DOMAIN_VAR[card.domainKey] + ')">' +
        '<div class="rb-body">' +
          '<div class="rb-top">' +
            '<span class="rb-cost">' + (card.cost != null ? card.cost : '—') + '</span>' +
            '<span class="rb-domdots">' + dot + '</span>' +
            '<span class="rb-name">' + escapeHtml(card.name) + '</span>' +
            '<span class="rb-badges">' + badges + '</span>' +
          '</div>' +
          '<div class="rb-meta">' + escapeHtml(cap(card.type)) + '</div>' +
        '</div>' +
      '</div>'
    );
  }

  function renderGroups(cards) {
    if (!cards.length) return '';
    return groupByCost(cards).map(function (g) {
      return '<div class="cost-divider"><span class="cost-divider-badge">' + (g.cost != null ? g.cost : '—') + '</span>' +
        '<span class="cost-divider-label">' + g.cards.length + ' card' + (g.cards.length !== 1 ? 's' : '') + '</span></div>' +
        '<div class="card-grid">' + g.cards.map(renderCard).join('') + '</div>';
    }).join('');
  }

  function render() {
    var resultsEl = document.getElementById('results');
    var html = '';
    var total = 0;

    if (mode === 'colors') {
      if (!state.colorA || !state.colorB) {
        resultsEl.innerHTML = '<p class="status-msg">Select two colors above to see cards.</p>';
        document.getElementById('resultCount').textContent = '';
        return;
      }
      var colors = [state.colorA, state.colorB];
      var pool = interactionCards.filter(function (c) { return cardFitsColors(c, colors); });
      total = pool.length;
      html = pool.length ? renderGroups(pool) : '<p class="status-msg">No cards found for this selection.</p>';
    } else {
      if (!state.leaderId) {
        resultsEl.innerHTML = '<p class="status-msg">Select a leader above to see cards.</p>';
        document.getElementById('resultCount').textContent = '';
        return;
      }
      var leader = leaders.filter(function (l) { return l.id === state.leaderId; })[0];
      if (!leader) { resultsEl.innerHTML = ''; return; }

      var sigCards = leader.signatureCards;

      var mainPool = interactionCards.filter(function (c) { return cardFitsColors(c, leader.domains); });

      total = sigCards.length + mainPool.length;

      var sigHtml = '<div class="sig-section">' +
        '<div class="sig-heading">Signature — ' + escapeHtml(leader.champion) +
          '<span class="count">' + sigCards.length + ' card' + (sigCards.length !== 1 ? 's' : '') + '</span></div>' +
        '<p class="sig-note">' + escapeHtml(leader.champion) + '’s own card(s) from the curated pool — shown regardless of Energy grouping below.</p>' +
        (sigCards.length ? renderGroups(sigCards) : '<p class="status-msg" style="padding:1rem;">No signature cards found.</p>') +
        '</div>';

      var mainHtml = mainPool.length ? renderGroups(mainPool) : '<p class="status-msg">No cards found for this selection.</p>';

      html = sigHtml + mainHtml;
    }

    document.getElementById('results').innerHTML = html;
    document.getElementById('resultCount').textContent = total + ' card' + (total !== 1 ? 's' : '') + ' shown';
  }

  function rebuildColorSelects() {
    ['colorA', 'colorB'].forEach(function (id) {
      var otherVal = id === 'colorA' ? state.colorB : state.colorA;
      var sel = document.getElementById(id);
      var current = sel.value;
      sel.innerHTML = '<option value="">Color ' + (id === 'colorA' ? 'A' : 'B') + '…</option>';
      COLOR_DOMAINS.forEach(function (d) {
        if (d === otherVal) return;
        var opt = document.createElement('option');
        opt.value = d;
        opt.textContent = d;
        sel.appendChild(opt);
      });
      sel.value = current === otherVal ? '' : current;
    });
  }

  function buildLeaderRoster(leaderCards) {
    var byId = {};
    leaderCards.forEach(function (card) {
      if (!byId[card.leader]) byId[card.leader] = { id: card.leader, champion: card.name.split(',')[0].trim(), domains: [], signatureCards: [] };
      var l = byId[card.leader];
      l.signatureCards.push(card);
      if (card.requiredDomain && l.domains.indexOf(card.requiredDomain) === -1) l.domains.push(card.requiredDomain);
    });
    var roster = Object.keys(byId).map(function (k) { return byId[k]; });
    roster.forEach(function (l) {
      l.signatureCards.sort(sortByCostThenName);
      l.label = l.champion + ' — ' + (l.domains.length ? l.domains.join('/') : 'Colorless');
    });
    roster.sort(function (a, b) { return a.champion.localeCompare(b.champion); });
    return roster;
  }

  function populateLeaderSelect() {
    var sel = document.getElementById('leaderSelect');
    leaders.forEach(function (l) {
      var opt = document.createElement('option');
      opt.value = l.id;
      opt.textContent = l.label;
      sel.appendChild(opt);
    });
  }

  function buildColorLegend() {
    var el = document.getElementById('colorLegend');
    el.innerHTML = DOMAIN_ORDER.map(function (d) {
      return '<span class="color-legend-item"><span class="color-legend-dot" style="background:var(' + DOMAIN_VAR[d] + ')"></span>' + d + '</span>';
    }).join('');
  }

  function setMode(next) {
    mode = next;
    document.getElementById('modeColors').classList.toggle('active', mode === 'colors');
    document.getElementById('modeLeader').classList.toggle('active', mode === 'leader');
    document.getElementById('colorControls').hidden = mode !== 'colors';
    document.getElementById('leaderControls').hidden = mode !== 'leader';
    render();
  }

  function initControls() {
    document.getElementById('modeColors').addEventListener('click', function () { setMode('colors'); });
    document.getElementById('modeLeader').addEventListener('click', function () { setMode('leader'); });

    document.getElementById('colorA').addEventListener('change', function (e) {
      state.colorA = e.target.value;
      rebuildColorSelects();
      render();
    });
    document.getElementById('colorB').addEventListener('change', function (e) {
      state.colorB = e.target.value;
      rebuildColorSelects();
      render();
    });
    document.getElementById('leaderSelect').addEventListener('change', function (e) {
      state.leaderId = e.target.value;
      render();
    });

    document.getElementById('resetBtn').addEventListener('click', function () {
      state = { colorA: '', colorB: '', leaderId: '' };
      document.getElementById('colorA').value = '';
      document.getElementById('colorB').value = '';
      document.getElementById('leaderSelect').value = '';
      rebuildColorSelects();
      render();
    });

    rebuildColorSelects();
    buildColorLegend();
  }

  function init() {
    initControls();

    var cards = CARD_POOL.map(normalizeCard);
    interactionCards = cards.filter(function (c) {
      return !c.leader && (c.hasAction || c.hasReaction || c.hasHidden);
    });
    leaders = buildLeaderRoster(cards.filter(function (c) { return c.leader; }));
    populateLeaderSelect();

    render();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
<script src="../nav.js"></script>
</body>
</html>
