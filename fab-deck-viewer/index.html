<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FaB Deck Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,700&family=DM+Serif+Text:ital@0;1&display=swap">
  <script src="../nav.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #1c1814;
      --surface: #252018;
      --surface2: #2e271d;
      --border: #3a3025;
      --border2: #4a3e2e;
      --accent: #c4864a;
      --accent-bg: rgba(196,134,74,0.08);
      --accent-border: rgba(196,134,74,0.25);
      --accent-dim: rgba(196,134,74,0.10);
      --text: #e8dfd0;
      --muted: #9a8a76;
      --muted2: #b5a48e;
      --muted-2: #5a4e40;
      --favoured: #7ab87a;
      --favoured-bg: rgba(122,184,122,0.10);
      --favoured-border: rgba(122,184,122,0.25);
      --unfavoured: #f87171;
      --unfavoured-bg: rgba(248,113,113,0.10);
      --unfavoured-border: rgba(248,113,113,0.25);
      --even: #5ab4cc;
      --even-bg: rgba(90,180,204,0.08);
      --even-border: rgba(90,180,204,0.25);
      --autoloss: #a07ae8;
      --autoloss-bg: rgba(160,122,232,0.08);
      --autoloss-border: rgba(160,122,232,0.25);
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Serif Text', Georgia, serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.6;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.025) 1px, transparent 1px),
        radial-gradient(circle, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 4px 4px, 6px 6px;
      background-position: 0 0, 2px 2px;
    }

    .hero {
      padding: 2rem 1.5rem 1.5rem;
      border-bottom: 2px solid var(--text);
      position: relative;
      z-index: 1;
    }
    .hero-inner { max-width: 1400px; margin: 0 auto; display: flex; align-items: baseline; gap: 1.5rem; flex-wrap: wrap; }
    .hero h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 900;
      font-style: italic;
      letter-spacing: -0.02em;
      line-height: 1;
      color: var(--text);
    }
    .hero p { color: var(--muted); font-size: 0.9rem; font-style: italic; }
    .hero-stats { display: flex; gap: 0.5rem; flex-wrap: wrap; width: 100%; margin-top: 0.5rem; }
    .stat-pill {
      font-family: 'DM Serif Text', Georgia, serif;
      font-size: 0.78rem;
      font-style: italic;
      padding: 0.3rem 0.75rem;
      border-radius: 2px;
      background: var(--surface);
      border: 1px solid var(--border2);
      color: var(--muted2);
    }
    .stat-pill.accent { color: var(--accent); background: var(--accent-bg); border-color: var(--accent-border); }

    .toolbar {
      padding: 0.55rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: var(--surface);
      position: relative;
      z-index: 1;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-family: 'DM Serif Text', Georgia, serif;
      font-size: 0.75rem;
      font-style: italic;
      padding: 0.28rem 0.7rem;
      border-radius: 2px;
      border: 1px solid var(--border2);
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn:hover { border-color: var(--muted2); color: var(--text); }
    .btn.primary { background: var(--accent-bg); border-color: var(--accent-border); color: var(--accent); }
    .btn.primary:hover { background: rgba(196,134,74,0.14); border-color: rgba(196,134,74,0.5); }
    .btn.danger { color: var(--unfavoured); border-color: rgba(248,113,113,0.25); }
    .btn.danger:hover { background: var(--unfavoured-bg); border-color: rgba(248,113,113,0.5); }

    .main { max-width: 1000px; width: 100%; margin: 2rem auto; padding: 0 1.5rem 4rem; position: relative; z-index: 1; }
    .no-decks { text-align: center; padding: 3rem; color: var(--muted); font-size: 0.9rem; font-style: italic; }
    .no-decks p { margin-bottom: 1rem; }

    .tiles-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 0.75rem; }

    .deck-tile {
      display: block;
      text-decoration: none;
      color: inherit;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 2px;
      overflow: hidden;
      border-top: 2px solid var(--accent);
      transition: border-color 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }
    .deck-tile:hover { box-shadow: 0 6px 28px rgba(0,0,0,0.45); border-color: var(--border2); }
    .tile-body { padding: 1.1rem 1.25rem 0.9rem; }
    .tile-meta { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 0.6rem; }
    .badge {
      font-family: 'DM Serif Text', Georgia, serif;
      font-size: 0.65rem;
      font-style: italic;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.12rem 0.5rem;
      border-radius: 2px;
      border: 1px solid;
    }
    .badge.preset { color: var(--accent); background: var(--accent-bg); border-color: var(--accent-border); }
    .badge.hero-b { color: var(--muted2); background: var(--surface2); border-color: var(--border2); }
    .badge.format { color: var(--even); background: var(--even-bg); border-color: var(--even-border); }
    .tile-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.05rem;
      font-weight: 700;
      font-style: italic;
      line-height: 1.25;
      margin-bottom: 0.5rem;
    }
    .tile-ratings { display: flex; gap: 0.35rem; flex-wrap: wrap; margin-top: 0.5rem; }
    .rating-dot {
      font-size: 0.68rem;
      font-style: italic;
      padding: 0.1rem 0.45rem;
      border-radius: 2px;
      border: 1px solid;
    }
    .rating-dot.favoured { color: var(--favoured); background: var(--favoured-bg); border-color: var(--favoured-border); }
    .rating-dot.unfavoured { color: var(--unfavoured); background: var(--unfavoured-bg); border-color: var(--unfavoured-border); }
    .rating-dot.even { color: var(--even); background: var(--even-bg); border-color: var(--even-border); }
    .rating-dot.auto-loss { color: var(--autoloss); background: var(--autoloss-bg); border-color: var(--autoloss-border); }
    .tile-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 0.6rem; }
    .tile-date { font-size: 0.72rem; font-style: italic; color: var(--muted); }
    .tile-count { font-size: 0.72rem; font-style: italic; color: var(--muted2); }
    .tile-cta {
      display: flex; align-items: center; gap: 0.35rem; padding: 0.5rem 1.25rem;
      border-top: 1px solid var(--border);
      font-family: 'DM Serif Text', Georgia, serif; font-size: 0.78rem; font-style: italic;
      color: var(--muted); transition: color 0.15s, background 0.15s;
    }
    .deck-tile:hover .tile-cta { color: var(--muted2); background: rgba(232,223,208,0.04); }
    .tile-cta-arrow { margin-left: auto; font-size: 1rem; transition: transform 0.15s; }
    .deck-tile:hover .tile-cta-arrow { transform: translateX(3px); }

    /* Detail slide-over */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 500;
      background: rgba(0,0,0,0.72);
      display: flex;
      align-items: stretch;
      justify-content: flex-end;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.22s ease, visibility 0s linear 0.22s;
    }
    .overlay.open {
      opacity: 1;
      visibility: visible;
      transition: opacity 0.22s ease, visibility 0s linear 0s;
    }
    .detail-panel {
      width: 100%;
      max-width: 820px;
      background: var(--bg);
      border-left: 1px solid var(--border2);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: translateX(100%);
      transition: transform 0.28s cubic-bezier(0.32,0.72,0,1);
    }
    .overlay.open .detail-panel { transform: translateX(0); }
    .detail-header {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      padding: 1.5rem;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      background: var(--surface);
    }
    .detail-header-info { flex: 1; min-width: 0; }
    .detail-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.5rem;
      font-weight: 700;
      font-style: italic;
      line-height: 1.2;
      margin-bottom: 0.5rem;
    }
    .detail-meta { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .detail-actions { display: flex; gap: 0.4rem; margin-top: 0.75rem; }
    .detail-close {
      display: flex; align-items: center; justify-content: center;
      width: 32px; height: 32px;
      border: 1px solid var(--border2);
      border-radius: 2px;
      background: none;
      color: var(--muted);
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    .detail-close:hover { color: var(--text); border-color: var(--muted2); }
    .detail-body { flex: 1; overflow-y: auto; padding: 1.25rem 1.5rem; }

    .detail-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1.25rem;
    }
    .detail-tab {
      font-family: 'DM Serif Text', Georgia, serif;
      font-size: 0.8rem;
      font-style: italic;
      padding: 0.5rem 1rem;
      border: none;
      border-bottom: 2px solid transparent;
      background: none;
      color: var(--muted);
      cursor: pointer;
      margin-bottom: -1px;
      transition: color 0.15s, border-color 0.15s;
    }
    .detail-tab:hover { color: var(--text); }
    .detail-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .decklist-text {
      font-family: 'DM Serif Text', Georgia, serif;
      font-size: 0.82rem;
      font-style: italic;
      color: var(--muted2);
      line-height: 1.9;
      white-space: pre-wrap;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 1rem 1.25rem;
    }

    .matchup-grid { display: flex; flex-direction: column; gap: 0.6rem; }
    .matchup-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 2px;
      overflow: hidden;
    }
    .matchup-header {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.75rem 1rem;
      cursor: pointer;
      border-bottom: 1px solid transparent;
      transition: background 0.15s;
      user-select: none;
    }
    .matchup-header:hover { background: rgba(232,223,208,0.03); }
    .matchup-header.expanded { border-bottom-color: var(--border); }
    .matchup-hero {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1rem;
      font-weight: 700;
      font-style: italic;
      flex: 1;
    }
    .rating-badge {
      font-family: 'DM Serif Text', Georgia, serif;
      font-size: 0.65rem;
      font-style: italic;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 0.15rem 0.55rem;
      border-radius: 2px;
      border: 1px solid;
      white-space: nowrap;
    }
    .rating-badge.favoured { color: var(--favoured); background: var(--favoured-bg); border-color: var(--favoured-border); }
    .rating-badge.unfavoured { color: var(--unfavoured); background: var(--unfavoured-bg); border-color: var(--unfavoured-border); }
    .rating-badge.even { color: var(--even); background: var(--even-bg); border-color: var(--even-border); }
    .rating-badge.auto-loss { color: var(--autoloss); background: var(--autoloss-bg); border-color: var(--autoloss-border); }
    .go-first-badge { font-size: 0.65rem; font-style: italic; color: var(--muted); white-space: nowrap; }
    .matchup-chevron { color: var(--muted); font-size: 0.75rem; transition: transform 0.2s; flex-shrink: 0; }
    .matchup-header.expanded .matchup-chevron { transform: rotate(180deg); }
    .matchup-body { padding: 0.85rem 1rem; display: none; }
    .matchup-body.open { display: block; }
    .matchup-note {
      font-size: 0.8rem;
      font-style: italic;
      color: var(--muted2);
      margin-bottom: 0.75rem;
      white-space: pre-line;
      line-height: 1.65;
    }
    .matchup-section-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted-2);
      margin-bottom: 0.4rem;
    }
    .cards-out-list { display: flex; flex-direction: column; gap: 0.15rem; }
    .card-out-item {
      font-size: 0.78rem;
      font-style: italic;
      color: var(--muted);
      padding: 0.18rem 0;
      border-bottom: 1px solid var(--border);
    }
    .card-out-item:last-child { border-bottom: none; }

    /* Add deck modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 600;
      background: rgba(0,0,0,0.78);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease, visibility 0s linear 0.2s;
    }
    .modal-overlay.open {
      opacity: 1;
      visibility: visible;
      transition: opacity 0.2s ease, visibility 0s linear 0s;
    }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 2px;
      max-width: 560px;
      width: 100%;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .modal-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.25rem;
      font-weight: 700;
      font-style: italic;
    }
    .modal-body { padding: 1.25rem 1.5rem; overflow-y: auto; flex: 1; }
    .modal-footer {
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 0.5rem;
      justify-content: flex-end;
      flex-shrink: 0;
    }
    .field-label { font-size: 0.75rem; font-style: italic; color: var(--muted2); margin-bottom: 0.35rem; }
    .field-desc { font-size: 0.72rem; font-style: italic; color: var(--muted); margin-bottom: 0.75rem; line-height: 1.55; }
    textarea.decklist-input {
      width: 100%;
      min-height: 260px;
      background: var(--bg);
      border: 1px solid var(--border2);
      border-radius: 2px;
      color: var(--text);
      font-family: 'DM Serif Text', Georgia, serif;
      font-size: 0.8rem;
      font-style: italic;
      padding: 0.75rem 1rem;
      resize: vertical;
      outline: none;
      line-height: 1.75;
    }
    textarea.decklist-input:focus { border-color: var(--accent); }
    .modal-error { color: var(--unfavoured); font-size: 0.78rem; font-style: italic; margin-top: 0.5rem; display: none; }

    footer {
      padding: 1.75rem 2rem;
      font-size: 0.78rem;
      font-style: italic;
      color: var(--muted-2);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      position: relative;
      z-index: 1;
    }
    footer a { color: var(--muted); text-decoration: none; }
    footer a:hover { color: var(--text); }

    @media (max-width: 768px) {
      .tiles-grid { grid-template-columns: 1fr; }
      .hero { padding: 1.75rem 1.25rem 1.5rem; }
      .toolbar { padding: 0.55rem 1.25rem; }
      .detail-panel { max-width: 100%; border-left: none; }
    }
  </style>
</head>
<body>

  <header class="hero">
    <div class="hero-inner">
      <h1>Deck Builder</h1>
      <p>Build and analyse FaB decklists with full sideboard guides.</p>
      <div class="hero-stats" id="hero-stats"></div>
    </div>
  </header>

  <div class="toolbar">
    <button class="btn primary" id="btn-new-deck">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
        <path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      New Deck
    </button>
  </div>

  <main class="main">
    <div class="tiles-grid" id="decks-container"></div>
    <div class="no-decks" id="no-decks" style="display:none">
      <p>No decklists yet.</p>
      <button class="btn primary" id="btn-no-decks-add">Add your first deck →</button>
    </div>
  </main>

  <footer>
    <span id="page-version" style="opacity:0.65"></span>
    <a href="https://github.com/xssxghjk/My-FaB-Journey" target="_blank" rel="noopener">View on GitHub</a>
    <span id="storage-size"></span>
  </footer>

  <!-- Detail slide-over -->
  <div class="overlay" id="detail-overlay">
    <div class="detail-panel">
      <div class="detail-header">
        <div class="detail-header-info">
          <div class="detail-title" id="detail-title"></div>
          <div class="detail-meta" id="detail-meta"></div>
          <div class="detail-actions" id="detail-actions"></div>
        </div>
        <button class="detail-close" id="detail-close" aria-label="Close">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <div class="detail-body">
        <div class="detail-tabs">
          <button class="detail-tab active" data-tab="decklist">Decklist</button>
          <button class="detail-tab" data-tab="sideboard">Sideboard Guide</button>
        </div>
        <div class="tab-content active" id="tab-decklist"></div>
        <div class="tab-content" id="tab-sideboard"></div>
      </div>
    </div>
  </div>

  <!-- New deck modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">New Deck</span>
        <button class="detail-close" id="modal-close" aria-label="Close">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="field-label">Decklist</div>
        <div class="field-desc">Paste your decklist in FaBrary format. Include <code style="font-style:normal;color:var(--accent)">Name:</code>, <code style="font-style:normal;color:var(--accent)">Hero:</code>, and <code style="font-style:normal;color:var(--accent)">Format:</code> lines at the top.</div>
        <textarea class="decklist-input" id="new-deck-input" placeholder="Name: My Deck&#10;Hero: Briar&#10;Format: Silver Age&#10;&#10;Arena cards&#10;1x Beckoning Haunt&#10;...&#10;&#10;Deck cards&#10;3x Pummel (red)&#10;..."></textarea>
        <div class="modal-error" id="modal-error"></div>
      </div>
      <div class="modal-footer">
        <button class="btn" id="modal-cancel">Cancel</button>
        <button class="btn primary" id="modal-save">Save Deck</button>
      </div>
    </div>
  </div>

  <script>fetch('../version.json').then(r=>r.json()).then(v=>{var e=document.getElementById('page-version');if(e)e.textContent='v'+v.version}).catch(()=>{});</script>
  <script>(function(){var u=0;try{for(var k in localStorage){if(Object.prototype.hasOwnProperty.call(localStorage,k))u+=(k.length+localStorage[k].length)*2}}catch(e){}var pct=+(u/(5*1024*1024)*100).toFixed(1),el=document.getElementById('storage-size');if(el){el.textContent='Storage: '+pct+'%';el.style.opacity=0.65;if(pct>90)el.style.color='#f87171';else if(pct>70)el.style.color='#fbbf24';}})();</script>

  <script src="decklists/index.js"></script>
  <script>
  (function () {
    'use strict';

    var STORAGE_KEY = 'fab-deck-viewer:decks';

    function esc(str) {
      return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function loadUserDecks() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch (e) { return []; }
    }

    function saveUserDecks(decks) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(decks)); } catch (e) {}
    }

    function parseDeckMeta(text) {
      var name = '', hero = '', format = '', cardCount = 0;
      var lines = (text || '').split('\n');
      lines.forEach(function (line) {
        var m;
        if ((m = line.match(/^Name:\s*(.+)/i)))   name   = m[1].trim();
        if ((m = line.match(/^Hero:\s*(.+)/i)))   hero   = m[1].trim();
        if ((m = line.match(/^Format:\s*(.+)/i))) format = m[1].trim();
        if ((m = line.match(/^(\d+)x?\s+\S/)))    cardCount += parseInt(m[1], 10);
      });
      return { name: name, hero: hero, format: format, cardCount: cardCount };
    }

    function getDeckMeta(deck) {
      var hero = deck.hero || '', format = deck.format || '';
      if ((!hero || !format) && deck.decklist) {
        var p = parseDeckMeta(deck.decklist);
        hero   = hero   || p.hero;
        format = format || p.format;
      }
      return { hero: hero, format: format };
    }

    function getRatingCounts(deck) {
      if (!deck.sideboardGuide || !deck.sideboardGuide.length) return null;
      var c = { favoured: 0, unfavoured: 0, even: 0, 'auto-loss': 0 };
      deck.sideboardGuide.forEach(function (m) { if (c[m.rating] !== undefined) c[m.rating]++; });
      return c;
    }

    function ratingBadgeHtml(rating) {
      var cls = rating === 'auto-loss' ? 'auto-loss' : rating;
      var label = rating === 'auto-loss' ? 'Auto-loss' : (rating.charAt(0).toUpperCase() + rating.slice(1));
      return '<span class="rating-badge ' + cls + '">' + esc(label) + '</span>';
    }

    function formatDate(iso) {
      if (!iso) return '';
      try { return new Date(iso).toLocaleDateString('en-GB', { year: 'numeric', month: 'short', day: 'numeric' }); }
      catch (e) { return iso; }
    }

    function renderTile(deck) {
      var meta    = getDeckMeta(deck);
      var counts  = getRatingCounts(deck);
      var ratings = '';
      if (counts) {
        var parts = [];
        if (counts.favoured)     parts.push('<span class="rating-dot favoured">'   + counts.favoured     + ' favoured</span>');
        if (counts.even)         parts.push('<span class="rating-dot even">'       + counts.even         + ' even</span>');
        if (counts.unfavoured)   parts.push('<span class="rating-dot unfavoured">' + counts.unfavoured   + ' unfavoured</span>');
        if (counts['auto-loss']) parts.push('<span class="rating-dot auto-loss">'  + counts['auto-loss'] + ' auto-loss</span>');
        if (parts.length) ratings = '<div class="tile-ratings">' + parts.join('') + '</div>';
      }
      var metaHtml =
        (deck.preset     ? '<span class="badge preset">Preset</span>' : '') +
        (meta.hero       ? '<span class="badge hero-b">'   + esc(meta.hero)   + '</span>' : '') +
        (meta.format     ? '<span class="badge format">'   + esc(meta.format) + '</span>' : '');
      return '<div class="deck-tile" data-id="' + esc(deck.id) + '">' +
        '<div class="tile-body">' +
          '<div class="tile-meta">' + metaHtml + '</div>' +
          '<div class="tile-title">' + esc(deck.name || 'Untitled Deck') + '</div>' +
          ratings +
          '<div class="tile-footer">' +
            '<span class="tile-date">' + esc(formatDate(deck.savedAt)) + '</span>' +
            (deck.cardCount ? '<span class="tile-count">' + deck.cardCount + ' cards</span>' : '') +
          '</div>' +
        '</div>' +
        '<div class="tile-cta">View deck<span class="tile-cta-arrow">→</span></div>' +
      '</div>';
    }

    function renderSideboardGuide(guide) {
      if (!guide || !guide.length) {
        return '<p style="color:var(--muted);font-style:italic;font-size:0.85rem">No sideboard guide available for this deck.</p>';
      }
      var html = '<div class="matchup-grid">';
      guide.forEach(function (m, i) {
        var goFirst   = m.goFirst === 'first' ? 'Go first' : m.goFirst === 'second' ? 'Go second' : '';
        var cardsOut  = m.cardsOutRaw ? m.cardsOutRaw.trim().split('\n').filter(Boolean) : [];
        html +=
          '<div class="matchup-card">' +
            '<div class="matchup-header" data-idx="' + i + '">' +
              '<span class="matchup-hero">' + esc(m.hero || 'Unknown') + '</span>' +
              (m.rating  ? ratingBadgeHtml(m.rating) : '') +
              (goFirst   ? '<span class="go-first-badge">' + esc(goFirst) + '</span>' : '') +
              '<span class="matchup-chevron">▾</span>' +
            '</div>' +
            '<div class="matchup-body" id="mb-' + i + '">' +
              (m.note     ? '<div class="matchup-note">'          + esc(m.note)   + '</div>' : '') +
              (cardsOut.length ? '<div class="matchup-section-label">Cards Out</div>' +
                '<div class="cards-out-list">' +
                  cardsOut.map(function (c) { return '<div class="card-out-item">' + esc(c) + '</div>'; }).join('') +
                '</div>' : '') +
            '</div>' +
          '</div>';
      });
      html += '</div>';
      return html;
    }

    var allDecks = [];

    function buildDecks() {
      var presets = (window.PRESET_DECKS || []).map(function (d) { return Object.assign({}, d, { preset: true }); });
      allDecks = presets.concat(loadUserDecks());
    }

    function findDeck(id) {
      return allDecks.find(function (d) { return d.id === id; }) || null;
    }

    function render() {
      buildDecks();
      var container = document.getElementById('decks-container');
      var noDecks   = document.getElementById('no-decks');
      if (allDecks.length === 0) {
        container.innerHTML = '';
        noDecks.style.display = 'block';
      } else {
        noDecks.style.display = 'none';
        container.innerHTML = allDecks.map(renderTile).join('');
        container.querySelectorAll('.deck-tile').forEach(function (tile) {
          tile.addEventListener('click', function () { openDetail(tile.dataset.id); });
        });
      }
      var total   = allDecks.length;
      var presets = allDecks.filter(function (d) { return d.preset; }).length;
      document.getElementById('hero-stats').innerHTML =
        '<span class="stat-pill">' + total + ' deck' + (total !== 1 ? 's' : '') + '</span>' +
        (presets ? '<span class="stat-pill accent">' + presets + ' preset</span>' : '');
    }

    /* ── Detail panel ── */
    function openDetail(id) {
      var deck = findDeck(id);
      if (!deck) return;
      var meta = getDeckMeta(deck);
      document.getElementById('detail-title').textContent = deck.name || 'Untitled Deck';
      document.getElementById('detail-meta').innerHTML =
        (deck.preset  ? '<span class="badge preset">Preset</span>'              : '') +
        (meta.hero    ? '<span class="badge hero-b">' + esc(meta.hero)   + '</span>' : '') +
        (meta.format  ? '<span class="badge format">' + esc(meta.format) + '</span>' : '');

      var actionsEl = document.getElementById('detail-actions');
      actionsEl.innerHTML = !deck.preset
        ? '<button class="btn danger" id="btn-delete">Delete deck</button>'
        : '';
      if (!deck.preset) {
        document.getElementById('btn-delete').addEventListener('click', function () {
          if (confirm('Delete "' + (deck.name || 'this deck') + '"?')) {
            saveUserDecks(loadUserDecks().filter(function (d) { return d.id !== id; }));
            closeDetail();
            render();
          }
        });
      }

      document.getElementById('tab-decklist').innerHTML =
        deck.decklist
          ? '<pre class="decklist-text">' + esc(deck.decklist) + '</pre>'
          : '<p style="color:var(--muted);font-style:italic;font-size:0.85rem">No decklist text available.</p>';
      document.getElementById('tab-sideboard').innerHTML = renderSideboardGuide(deck.sideboardGuide);

      document.querySelectorAll('.detail-tab').forEach(function (t) { t.classList.remove('active'); });
      document.querySelectorAll('.tab-content').forEach(function (c) { c.classList.remove('active'); });
      document.querySelector('.detail-tab[data-tab="decklist"]').classList.add('active');
      document.getElementById('tab-decklist').classList.add('active');

      document.querySelectorAll('.matchup-header').forEach(function (hdr) {
        hdr.addEventListener('click', function () {
          var body = document.getElementById('mb-' + hdr.dataset.idx);
          var open = hdr.classList.toggle('expanded');
          if (body) body.classList.toggle('open', open);
        });
      });

      document.getElementById('detail-overlay').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeDetail() {
      document.getElementById('detail-overlay').classList.remove('open');
      document.body.style.overflow = '';
    }

    /* ── New deck modal ── */
    function openModal() {
      document.getElementById('new-deck-input').value = '';
      document.getElementById('modal-error').style.display = 'none';
      document.getElementById('modal-overlay').classList.add('open');
      setTimeout(function () { document.getElementById('new-deck-input').focus(); }, 60);
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.remove('open');
    }

    function saveNewDeck() {
      var text = document.getElementById('new-deck-input').value.trim();
      var errEl = document.getElementById('modal-error');
      errEl.style.display = 'none';
      if (!text) { errEl.textContent = 'Please paste your decklist.'; errEl.style.display = 'block'; return; }
      var parsed = parseDeckMeta(text);
      if (!parsed.name) { errEl.textContent = 'Could not find a "Name:" line. Add "Name: My Deck" at the top.'; errEl.style.display = 'block'; return; }
      var decks = loadUserDecks();
      decks.push({
        id:           'user:' + Date.now(),
        name:         parsed.name,
        hero:         parsed.hero,
        format:       parsed.format,
        savedAt:      new Date().toISOString(),
        preset:       false,
        cardCount:    parsed.cardCount || null,
        decklist:     text,
        sideboardGuide: []
      });
      saveUserDecks(decks);
      closeModal();
      render();
    }

    /* ── Init ── */
    function init() {
      render();

      document.getElementById('btn-new-deck').addEventListener('click', openModal);
      document.getElementById('btn-no-decks-add').addEventListener('click', openModal);
      document.getElementById('detail-close').addEventListener('click', closeDetail);
      document.getElementById('modal-close').addEventListener('click', closeModal);
      document.getElementById('modal-cancel').addEventListener('click', closeModal);
      document.getElementById('modal-save').addEventListener('click', saveNewDeck);

      document.getElementById('detail-overlay').addEventListener('click', function (e) {
        if (e.target === this) closeDetail();
      });
      document.getElementById('modal-overlay').addEventListener('click', function (e) {
        if (e.target === this) closeModal();
      });

      document.querySelectorAll('.detail-tab').forEach(function (tab) {
        tab.addEventListener('click', function () {
          document.querySelectorAll('.detail-tab').forEach(function (t) { t.classList.remove('active'); });
          document.querySelectorAll('.tab-content').forEach(function (c) { c.classList.remove('active'); });
          tab.classList.add('active');
          var panel = document.getElementById('tab-' + tab.dataset.tab);
          if (panel) panel.classList.add('active');
        });
      });

      document.addEventListener('keydown', function (e) {
        if (e.key !== 'Escape') return;
        if (document.getElementById('modal-overlay').classList.contains('open')) closeModal();
        else if (document.getElementById('detail-overlay').classList.contains('open')) closeDetail();
      });
    }

    init();
  })();
  </script>

</body>
</html>
